name: 🐞 Bug report
description: Something on nest.potenfyr.in or in the sync pipeline is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Is the problem with an **egg itself** (engine, variables, install
        behavior)? Report it in the relevant [*-Eggs
        repository](https://github.com/PotenFYR-Studios/Database-Eggs), not
        here. Security issues: use private reporting per
        [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or route
      description: URL or route where it happened (e.g. https://nest.potenfyr.in/docs)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog page (search, filters, cards)
        - About / Docs / Examples pages
        - Sync pipeline (workflow, sync-eggs.sh, catalog.json)
        - Build / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Search for ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / workflow logs
      description: Paste relevant output; use code fences. Never paste secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is a site/pipeline issue, not an egg issue
          required: true
        - label: I checked the live site and recent sync runs before filing
          required: false
