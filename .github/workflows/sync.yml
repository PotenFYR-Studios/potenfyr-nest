name: Sync Egg Mirrors

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-eggs
  cancel-in-progress: false

jobs:
  sync:
    name: Harvest egg catalog from org *-Eggs repos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      catalog_changed: ${{ steps.catalog.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync egg catalog
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-eggs.sh
          if git rev-parse HEAD@{1} >/dev/null 2>&1 && ! git diff --quiet HEAD@{1} HEAD -- docs/data/catalog.json 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy site to GitHub Pages
    needs: sync
    if: needs.sync.outputs.catalog_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
