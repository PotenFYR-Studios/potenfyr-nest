name: Sync Eggs and Deploy Site

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"

# Minimal default; each job grants only what it needs.
permissions: {}

concurrency:
  group: sync-eggs
  cancel-in-progress: false

jobs:
  sync:
    name: Harvest egg catalog and egg JSON from org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    permissions:
      contents: write # commit the regenerated catalog and push to master

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync catalog, egg mirrors and README
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-eggs.sh
          if git rev-parse 'HEAD@{1}' >/dev/null 2>&1 && git diff --quiet 'HEAD@{1}' HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build with Bun and deploy to GitHub Pages
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read # checkout
      pages: write # deploy the Pages artifact
      id-token: write # OIDC for the Pages deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Prerender catalog into HTML and JSON-LD
        run: bun scripts/prerender.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
